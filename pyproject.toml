[project]
name = "aaa"
version = "0.1.0"
description = "Agentic Academic Assistant"
requires-python = ">=3.11"
dependencies = [
    "litestar[jwt,standard]",
    "pwdlib[argon2]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "python-dotenv",
    "pydantic[email]",
    "advanced-alchemy[uuid]",
    "langchain-ollama",
    "langchain-core",
    "pymupdf",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
